<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Pi^n</title>
  <style>
    /* Transparent canvas: keep Pi's three Bauhaus blocks fixed while adapting
       the superscript exponent `n` for light and dark browser tab strips. */
    .exp { fill: #262B34; }
    @media (prefers-color-scheme: light) { .exp { fill: #262B34; } }
    @media (prefers-color-scheme: dark) { .exp { fill: #E6EBF2; } }
  </style>
