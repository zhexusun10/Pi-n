  <path fill="#4D9ABF" d="M42 168H130V256H218V344H130V432H42Z"/>
  <path fill="#F1BE58" d="M306 256H394V432H306Z"/>
  <path class="exp" d="M350 80H430V120H390V200H350Z"/>
  <path class="exp" d="M430 120H470V200H430Z"/>
</svg>
